<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">第21组实验二概念ER图</title>
<desc id="desc">USER预置用户、BOOK_LISTING书籍发布记录、RESERVATION_ORDER预留订单三实体，具有发布、预留、关联订单三种联系。每用户有零到多个书籍记录，每用户有零到多个订单，每书籍有零到多个历史订单，订单必须有一个用户和一本书；每书同时最多一条有效订单。</desc>
<rect width="1500" height="940" fill="#FAFCFE"/>
<rect x="0" y="0" width="1500" height="104" fill="#1D3551"/>
<text x="750" y="55" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">实验二 · 数据库概念 ER 图</text>
<text x="750" y="83" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" fill="#CEDFF4" text-anchor="middle">需求基线 v0.5.6　 ·　三实体／三联系　 ·　不是数据库表间关系图</text>
