<text x="572" y="172" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="20" font-weight="700" fill="#223D57">USER · 预置用户</text><circle cx="577" cy="216" r="3" fill="#6286B2"/><text x="593" y="222" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">user_id　〔主标识〕</text><circle cx="577" cy="250" r="3" fill="#6286B2"/><text x="593" y="256" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">account_code　〔建议账号标识〕</text><text x="722.5" y="338" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="14.5" font-weight="600" fill="#6286B2">同一账号可同时承担买家、卖家</text><rect x="64" y="522" width="445" height="300" rx="17" fill="#1D3551" fill-opacity=".075"/><rect x="60" y="515" width="445" height="300" rx="17" fill="#EDFAF4" stroke="#3F977A" stroke-width="2.5"/>
<path d="M61,571 H504" stroke="#3F977A" stroke-width="1.5"/>
<text x="82" y="552" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="20" font-weight="700" fill="#223D57">BOOK_LISTING · 书籍发布记录</text><circle cx="87" cy="596" r="3" fill="#3F977A"/><text x="103" y="602" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">book_id　〔主标识〕</text><circle cx="87" cy="624" r="3" fill="#3F977A"/><text x="103" y="630" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">title　书名／author　作者</text><circle cx="87" cy="652" r="3" fill="#3F977A"/><text x="103" y="658" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">price　正数价格，最多两位小数</text><circle cx="87" cy="680" r="3" fill="#3F977A"/><text x="103" y="686" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">condition　固定三档成色</text><circle cx="87" cy="708" r="3" fill="#3F977A"/><text x="103" y="714" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">description　可选说明</text><circle cx="87" cy="736" r="3" fill="#3F977A"/><text x="103" y="742" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">status　可售／已预留</text><circle cx="87" cy="764" r="3" fill="#3F977A"/><text x="103" y="770" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">created_at　系统创建时间</text><text x="282.5" y="793" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="14.5" font-weight="600" fill="#3F977A">一条发布记录对应一本实物书</text><rect x="994" y="522" width="420" height="300" rx="17" fill="#1D3551" fill-opacity=".075"/><rect x="990" y="515" width="420" height="300" rx="17" fill="#FFF7EC" stroke="#C08C47" stroke-width="2.5"/>
<path d="M991,571 H1409" stroke="#C08C47" stroke-width="1.5"/>
<text x="1012" y="552" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="20" font-weight="700" fill="#223D57">RESERVATION_ORDER · 预留订单</text><circle cx="1017" cy="596" r="3" fill="#C08C47"/><text x="1033" y="602" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">order_id　〔主标识〕</text><circle cx="1017" cy="630" r="3" fill="#C08C47"/><text x="1033" y="636" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">status　有效／已取消</text><circle cx="1017" cy="664" r="3" fill="#C08C47"/><text x="1033" y="670" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">created_at　〔建议〕</text><circle cx="1017" cy="698" r="3" fill="#C08C47"/><text x="1033" y="704" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="16.5" fill="#293D50">cancelled_at　〔可选建议〕</text><text x="1200" y="793" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="14.5" font-weight="600" fill="#C08C47">多条历史订单可保存，仅一条当前有效</text><rect x="545" y="357" width="44" height="29" rx="14" fill="white" stroke="#D2DBE7"/><text x="567" y="377" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" font-weight="700" fill="#354D6A">1</text><rect x="358.5" y="489" width="69" height="29" rx="14" fill="white" stroke="#D2DBE7"/><text x="393" y="509" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" font-weight="700" fill="#354D6A">0..N</text><rect x="858" y="353" width="44" height="29" rx="14" fill="white" stroke="#D2DBE7"/><text x="880" y="373" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" font-weight="700" fill="#354D6A">1</text><rect x="1085.5" y="490" width="69" height="29" rx="14" fill="white" stroke="#D2DBE7"/><text x="1120" y="510" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" font-weight="700" fill="#354D6A">0..N</text><rect x="512" y="660" width="44" height="29" rx="14" fill="white" stroke="#D2DBE7"/><text x="534" y="680" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" font-weight="700" fill="#354D6A">1</text><rect x="895.5" y="662" width="69" height="29" rx="14" fill="white" stroke="#D2DBE7"/><text x="930" y="682" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" font-weight="700" fill="#354D6A">0..N</text><rect x="150" y="847" width="1200" height="67" rx="13" fill="#F2F5FA" stroke="#BCCBDB"/>
<text x="750" y="873" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="17" font-weight="700" fill="#34465C">特别约束：每书可以有 0..N 条历史订单，但同一时刻最多只有 1 条有效订单</text>
<text x="750" y="899" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans,Arial" font-size="15" fill="#5A6E85">还需校验：不可自购 · 买家本人才能取消 · 旧订单请求不得影响新订单（ER 图本身不能强制实现）</text>
