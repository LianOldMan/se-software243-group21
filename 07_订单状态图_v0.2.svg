<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
</marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
</marker>
</defs>
<rect width="1320" height="780" fill="#ffffff"/>
<text x="50" y="48" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="start">
<tspan x="50" dy="0">ReservationOrder 订单状态图 v0.2</tspan>
</text>
<text x="50" y="78" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">
<tspan x="50" dy="0">依据：统一类与操作约定 v0.3 ｜ OrderStatus = {有效, 已取消} ｜ 设计推演，未实现、未实测</tspan>
</text>
<line x1="50" y1="96" x2="1270" y2="96" stroke="#d1d5db" stroke-width="1"/>

<g>
<rect x="50" y="118" width="1180" height="86" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="64" y="142" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10.5" fill="#4b3b12"><tspan x="64" dy="0">状态集合：OrderStatus = {有效, 已取消}；ListingStatus = {可售, 已预留}。不新增“已支付/已完成/已发货”等状态。</tspan>
<tspan x="64" dy="18">已取消是业务终态：记录保留、不物理删除；再次预留必须新建 orderId，旧订单不能复活。</tspan>
<tspan x="64" dy="18">失败与拒绝不是状态迁移：返回错误码，订单和书籍的已有状态保持不变。</tspan></text>
</g>

<circle cx="92" cy="342" r="13" fill="#111827" stroke="#111827"/>
<g>
<rect x="200" y="282" width="280" height="126" rx="14" ry="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<line x1="200" y1="322" x2="480" y2="322" stroke="#2563eb" stroke-width="1.2"/>
<text x="340.0" y="308" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f2742" text-anchor="middle">
<tspan x="340.0" dy="0">有效（Active）</tspan>
</text>
<text x="340.0" y="348" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0f2742" text-anchor="middle">
<tspan x="340.0" dy="0">orderStatus = 有效</tspan>
<tspan x="340.0" dy="18">activeListingId = listingId</tspan>
<tspan x="340.0" dy="18">cancelledAt = NULL</tspan>
</text>
</g>
<g>
<rect x="650" y="282" width="280" height="126" rx="14" ry="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<line x1="650" y1="322" x2="930" y2="322" stroke="#dc2626" stroke-width="1.2"/>
<text x="790.0" y="308" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f2742" text-anchor="middle">
<tspan x="790.0" dy="0">已取消（Cancelled）</tspan>
</text>
<text x="790.0" y="348" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0f2742" text-anchor="middle">
<tspan x="790.0" dy="0">orderStatus = 已取消</tspan>
<tspan x="790.0" dy="18">cancelledAt = DB NOW(6)</tspan>
<tspan x="790.0" dy="18">activeListingId = NULL</tspan>
</text>
</g>
<circle cx="1050" cy="345" r="22" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<circle cx="1050" cy="345" r="13" fill="#111827" stroke="#111827"/>

<line x1="105" y1="342" x2="198" y2="342" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="150" y1="266" x2="150" y2="338" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="482" y1="266" x2="482" y2="338" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<text x="112" y="238" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="start">
<tspan x="112" dy="0">placeReservation [账号/书/token 合法]</tspan>
</text>
<text x="112" y="258" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#4b5563" text-anchor="start">
<tspan x="112" dy="0">/ 建有效订单；placedAt=DB NOW</tspan>
</text>

<line x1="480" y1="345" x2="648" y2="345" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="482" y="238" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="start">
<tspan x="482" dy="0">cancelReservation [本人 ∧ 有效]</tspan>
</text>
<text x="482" y="258" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#4b5563" text-anchor="start">
<tspan x="482" dy="0">/ cancelIfActive = 1 行 → markCancelled(DB NOW)</tspan>
</text>

<line x1="930" y1="345" x2="1026" y2="345" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="934" y="320" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4b5563" text-anchor="start">
<tspan x="934" dy="0">[已取消] / «lifecycle» 记录保留</tspan>
</text>

<g>
<rect x="50" y="500" width="600" height="120" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="64" y="524" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10.5" fill="#4b3b12"><tspan x="64" dy="0">拒绝路径（不产生状态迁移）：</tspan>
<tspan x="64" dy="18">• 非订单买家取消、重复取消、越权取消；</tspan>
<tspan x="64" dy="18">• 旧订单已取消后又到达的取消请求；</tspan>
<tspan x="64" dy="18">• 订单不存在或状态不是“有效”。</tspan>
<tspan x="64" dy="18">处理：返回 FORBIDDEN_CANCEL / ORDER_NOT_ACTIVE /</tspan>
<tspan x="64" dy="18">ORDER_NOT_FOUND；O 与 X 的状态、历史和其他订单均不变。</tspan></text>
</g>
<g>
<rect x="680" y="500" width="560" height="120" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="694" y="524" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10.5" fill="#4b3b12"><tspan x="694" dy="0">创建失败（不产生订单记录）：</tspan>
<tspan x="694" dy="18">• 账号无效、书不存在或不可售；</tspan>
<tspan x="694" dy="18">• 买家就是发布者（R-04）；</tspan>
<tspan x="694" dy="18">• token 跨书复用、并发冲突、系统故障。</tspan>
<tspan x="694" dy="18">保证：失败不写半完成数据；不新增 OrderStatus；</tspan>
<tspan x="694" dy="18">由服务事务回滚，书籍状态不被错误占用。</tspan></text>
</g>

<text x="50" y="690" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#4b5563" text-anchor="start">
<tspan x="50" dy="0">图例：● 初始伪状态   ▭ 业务状态   ◉ 终止（生命周期结束，记录保留）   → 事件 [守卫] / 动作</tspan>
</text>
<text x="50" y="714" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">
<tspan x="50" dy="0">说明：状态图只表达合法状态迁移；拒绝/失败路径以注释表示，不能画成新的订单状态。</tspan>
</text>
<text x="50" y="748" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#9ca3af" text-anchor="start">
<tspan x="50" dy="0">C · 2026-11-24 · 设计推演，未实现、未实测</tspan>
</text>
</svg>